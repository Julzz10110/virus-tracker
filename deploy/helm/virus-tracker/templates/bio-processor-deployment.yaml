apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virus-tracker.fullname" . }}-bio-processor
  labels:
    {{- include "virus-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bioProcessor.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: bio-processor
      {{- include "virus-tracker.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bio-processor
        {{- include "virus-tracker.labels" . | nindent 8 }}
    spec:
      containers:
        - name: bio-processor
          image: "{{ .Values.bioProcessor.image.repository }}:{{ .Values.bioProcessor.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: BACKEND_BASE_URL
              value: {{ .Values.bioProcessor.env.backendBaseUrl | quote }}
            - name: BACKEND_TIMEOUT_SECONDS
              value: {{ .Values.bioProcessor.env.backendTimeoutSeconds | quote }}
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.bioProcessor.resources | nindent 12 }}
