apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "virus-tracker.fullname" . }}-backend
  labels:
    {{- include "virus-tracker.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ .Values.backend.env.databaseUrl | quote }}
  BIO_PROCESSOR_URL: {{ .Values.backend.env.bioProcessorUrl | quote }}
  TOKEN_TTL_HOURS: {{ .Values.backend.env.tokenTtlHours | quote }}
  GROWTH_ALERT_THRESHOLD: {{ .Values.backend.env.growthAlertThreshold | quote }}
  RUST_LOG: {{ .Values.backend.env.rustLog | quote }}
  RUST_BACKTRACE: "1"
