apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virus-tracker.fullname" . }}-backend
  labels:
    {{- include "virus-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "virus-tracker.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "virus-tracker.labels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "virus-tracker.fullname" . }}-backend
          {{- if .Values.backend.env.jwtSecret }}
            - secretRef:
                name: {{ include "virus-tracker.fullname" . }}-backend
          {{- end }}
          volumeMounts:
            - name: backend-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: backend-data
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "virus-tracker.fullname" . }}-backend
          {{- else }}
          emptyDir: {}
          {{- end }}
